@if (tab$ | async; as tab) {
    <p style="white-space: pre-line;">{{ tab.tabToString }}</p>
    
    
    @if (midi$ | async; as midi){
      @if(midi){
        <a href="{{midi.url}}" target="_blank">Download your midi file</a>
      }
    }
    @if(midiTone$ | async; as midiTone){
      <button (click)="playMidi(midiTone)">Play</button>
      <button (click)="disposeSynths()" >Stop</button>
    }
} @else {
  <p>Loading…</p>
}
